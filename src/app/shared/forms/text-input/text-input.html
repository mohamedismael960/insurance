<div class="grid gap-1.5 text-sm">
  @if (label()) {
    <span class="font-medium">{{ label() }}</span>
  }

  <input
    pInputText
    class="w-full"
    [type]="type()"
    [formControl]="control"
    [attr.aria-label]="label()"
    (blur)="markAsTouched()"
  />

  @if (hint()) {
    <p class="text-muted">{{ hint() }}</p>
  }
</div>
